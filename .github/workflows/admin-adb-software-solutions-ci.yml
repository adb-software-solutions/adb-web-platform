name: ADB Software Solutions Admin CI

on:
    push:
        branches: ["main"]
        tags: ["*"]
        paths: &paths
            - "sites/admin-adb-software-solutions/**"
            - "packages/**"
            - "Dockerfile.admin-adb-software-solutions"
            - "package.json"
            - "pnpm-workspace.yaml"
            - "pnpm-lock.yaml"
            - ".github/workflows/admin-adb-software-solutions-ci.yml"
    pull_request:
        paths: *paths
    workflow_dispatch:

concurrency:
    group: admin-adb-software-solutions-ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test-and-build:
        name: Test and Build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4.1.0
              with:
                  version: 10.15.0
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml
            - run: pnpm install --frozen-lockfile
            - run: pnpm --dir sites/admin-adb-software-solutions test --passWithNoTests
            - run: pnpm --dir sites/admin-adb-software-solutions build
    trivy-fs-scan:
        name: Trivy Filesystem Scan
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: aquasecurity/trivy-action@master
              with:
                  scan-type: fs
                  scan-ref: sites/admin-adb-software-solutions
                  severity: HIGH,CRITICAL
                  output: trivy-fs-scan.txt
              env:
                  TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db,public.ecr.aws/aquasecurity/trivy-db
                  TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db,public.ecr.aws/aquasecurity/trivy-java-db
            - uses: actions/upload-artifact@v4
              with:
                  name: trivy-fs-scan-admin-adb-software-solutions
                  path: trivy-fs-scan.txt
    docker-build:
        name: Docker Build
        runs-on: ubuntu-latest
        needs: [test-and-build, trivy-fs-scan]
        steps:
            - uses: actions/checkout@v4
            - name: Generate CI environment
              run: |
                  {
                    echo "NEXT_PUBLIC_GTM_ID=";
                    echo "NEXT_PUBLIC_API_URL=http://localhost:8000/api";
                  } > sites/admin-adb-software-solutions/.ci.env
            - run: docker build -f Dockerfile.admin-adb-software-solutions -t adb-web-platform/admin-adb-software-solutions:ci .
