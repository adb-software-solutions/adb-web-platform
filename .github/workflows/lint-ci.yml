name: Repository Lint CI

on:
    push:
        branches: [main]
        paths:
            - "backend/**"
            - "sites/**"
            - "packages/**"
            - "tools/**"
            - "docs/**"
            - "*.json"
            - "*.md"
            - "*.yaml"
            - "*.yml"
            - "pyproject.toml"
            - "pnpm-lock.yaml"
            - "pnpm-workspace.yaml"
            - ".github/workflows/lint-ci.yml"
    pull_request:
        paths:
            - "backend/**"
            - "sites/**"
            - "packages/**"
            - "tools/**"
            - "docs/**"
            - "*.json"
            - "*.md"
            - "*.yaml"
            - "*.yml"
            - "pyproject.toml"
            - "pnpm-lock.yaml"
            - "pnpm-workspace.yaml"
            - ".github/workflows/lint-ci.yml"
    workflow_dispatch:

concurrency:
    group: repository-lint-ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        permissions:
            contents: read
        uses: adb-software-solutions/github-actions-workflows/.github/workflows/lint.yml@v1
        with:
            pnpm-version: 10.15.0
            lint-command: SECRET_KEY=lint-only-secret-key tools/lint
