name: Repository Lint CI

on:
    push:
        branches: ["main"]
        paths:
            - "backend/**"
            - "sites/**"
            - "packages/**"
            - "tools/**"
            - "docs/**"
            - "*.json"
            - "*.md"
            - "*.yaml"
            - "*.yml"
            - "pyproject.toml"
            - "pnpm-lock.yaml"
            - "pnpm-workspace.yaml"
            - ".github/workflows/lint-ci.yml"
    pull_request:
        paths:
            - "backend/**"
            - "sites/**"
            - "packages/**"
            - "tools/**"
            - "docs/**"
            - "*.json"
            - "*.md"
            - "*.yaml"
            - "*.yml"
            - "pyproject.toml"
            - "pnpm-lock.yaml"
            - "pnpm-workspace.yaml"
            - ".github/workflows/lint-ci.yml"
    workflow_dispatch:

concurrency:
    group: repository-lint-ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        name: Run Repository Linters
        runs-on: ubuntu-latest
        env:
            SECRET_KEY: lint-only-secret-key
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: pnpm/action-setup@v4.1.0
              with:
                  version: 10.15.0
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml
            - run: pnpm install --frozen-lockfile
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: backend/requirements/dev.txt
            - run: pip install -r backend/requirements/dev.txt
            - name: Install shell lint tools
              run: |
                  tools/setup/install-shellcheck
                  tools/setup/install-shfmt
            - name: Capture formatter output
              run: |
                  ruff check --fix backend/apps/website/tests.py
                  pnpm exec prettier --write docs/PLATFORM_MASTER_PLAN.md sites/admin-adb-software-solutions/src/lib/api/endpoints.ts
                  git diff -- backend/apps/website/tests.py docs/PLATFORM_MASTER_PLAN.md sites/admin-adb-software-solutions/src/lib/api/endpoints.ts
                  test -z "$(git status --porcelain -- backend/apps/website/tests.py docs/PLATFORM_MASTER_PLAN.md sites/admin-adb-software-solutions/src/lib/api/endpoints.ts)"
            - run: git fetch origin main
            - run: tools/lint
