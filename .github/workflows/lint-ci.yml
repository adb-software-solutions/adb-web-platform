name: Repository Lint CI

on:
    push:
        branches: ["main"]
        paths:
            - "backend/**"
            - "sites/**"
            - "packages/**"
            - "tools/**"
            - "package.json"
            - "pnpm-workspace.yaml"
            - "pnpm-lock.yaml"
            - ".github/workflows/**"
    pull_request:
        paths:
            - "backend/**"
            - "sites/**"
            - "packages/**"
            - "tools/**"
            - "package.json"
            - "pnpm-workspace.yaml"
            - "pnpm-lock.yaml"
            - ".github/workflows/**"
    workflow_dispatch:

concurrency:
    group: repository-lint-ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        name: Run Repository Linters
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: pnpm/action-setup@v4.1.0
              with:
                  version: 10.15.0
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml
            - name: Install Node dependencies
              run: pnpm install --frozen-lockfile
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: backend/requirements/dev.txt
            - name: Install Python tooling
              run: pip install -r backend/requirements/dev.txt
            - name: Install shell tooling
              run: |
                  tools/setup/install-shellcheck
                  tools/setup/install-shfmt
            - name: Fetch main for comparison
              run: git fetch origin main
            - name: Run repository linters
              run: tools/lint
