name: ADB Analytics CI

on:
    push:
        branches: [main]
        paths: &paths
            - "sites/analytics-adb-software-solutions/**"
            - "packages/**"
            - "Dockerfile.analytics-adb-software-solutions"
            - "package.json"
            - "pnpm-workspace.yaml"
            - "pnpm-lock.yaml"
            - ".github/workflows/analytics-adb-software-solutions-ci.yml"
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
        paths: *paths
    workflow_dispatch:

concurrency:
    group: analytics-adb-software-solutions-ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    frontend:
        permissions:
            contents: read
            id-token: write
        uses: adb-software-solutions/github-actions-workflows/.github/workflows/frontend-ci.yml@v1
        with:
            pnpm-version: 10.15.0
            working-directory: sites/analytics-adb-software-solutions
            lockfile: pnpm-lock.yaml
            test-command: pnpm test

    trivy:
        permissions:
            contents: read
        uses: adb-software-solutions/github-actions-workflows/.github/workflows/trivy-fs.yml@v1
        with:
            scan-path: sites/analytics-adb-software-solutions
            artifact-name: trivy-fs-scan-analytics-adb-software-solutions

    build:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: [frontend, trivy]
        permissions:
            contents: read
            id-token: write
        uses: adb-software-solutions/github-actions-workflows/.github/workflows/docker-build-push.yml@v1
        with:
            application: adb-web-platform
            images: '["analytics-adb-software-solutions"]'
            infisical-identity-id: 199f317a-d030-4f03-bbd7-ebf986030b09
            infisical-registry-project-id: 848009f4-aa7d-45e2-8fb6-404bd8f25115
            infisical-application-project-id: 51df9308-efb3-45b0-94ed-bf641f076acf
            build-env-file: sites/analytics-adb-software-solutions/.ci.env
            optional-build-env-keys: '["NEXT_PUBLIC_API_URL","NEXT_PUBLIC_APP_URL","NEXT_PUBLIC_AUTH_URL","NEXT_PUBLIC_WEB_DESIGNS_URL","NEXT_PUBLIC_TECHNOLOGY_URL"]'

    docker-build:
        # Pull requests build the images without pushing them.
        if: github.event_name == 'pull_request'
        needs: [frontend, trivy]
        permissions:
            contents: read
            id-token: write
        uses: adb-software-solutions/github-actions-workflows/.github/workflows/docker-build-ci.yml@v1
        with:
            application: adb-web-platform
            images: '["analytics-adb-software-solutions"]'
            infisical-identity-id: 472a9ad4-4bbd-49b9-94a0-ac81905a1799
            infisical-application-project-id: cb12b399-589e-4d62-b8b8-7f4ffe4538e0
            build-env-file: sites/analytics-adb-software-solutions/.ci.env
            optional-build-env-keys: '["NEXT_PUBLIC_API_URL","NEXT_PUBLIC_APP_URL","NEXT_PUBLIC_AUTH_URL","NEXT_PUBLIC_WEB_DESIGNS_URL","NEXT_PUBLIC_TECHNOLOGY_URL"]'
