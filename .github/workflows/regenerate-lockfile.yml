name: Regenerate pnpm Lockfile

on:
    push:
        branches:
            - refactor/split-admin-and-marketing-sites
        paths:
            - .github/workflows/regenerate-lockfile.yml

permissions:
    contents: write

jobs:
    regenerate:
        name: Regenerate Workspace Lockfile
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.ref_name }}
                  fetch-depth: 0
            - uses: pnpm/action-setup@v4.1.0
              with:
                  version: 10.15.0
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml
            - name: Regenerate lockfile
              run: pnpm install --no-frozen-lockfile
            - name: Commit lockfile
              run: |
                  if git diff --quiet -- pnpm-lock.yaml; then
                    echo "Lockfile is already current."
                    exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add pnpm-lock.yaml
                  git commit -m "build: Regenerate workspace lockfile."
                  git push origin "HEAD:${GITHUB_REF_NAME}"
