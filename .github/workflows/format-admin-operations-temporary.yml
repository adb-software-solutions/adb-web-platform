name: Temporary Admin Operations Formatter

on:
  push:
    branches:
      - refactor/admin-operations-ui

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'Apply repository formatting') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: refactor/admin-operations-ui
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: 10.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff==0.12.11

      - name: Apply Python formatting
        run: |
          ruff check --fix \
            backend/apps/core/management/commands/seed_infrastructure_development.py \
            backend/apps/core/test_admin_operations_api.py \
            backend/apps/core/test_resource_admin_api.py \
            backend/apps/core/ninja/resource_views.py \
            backend/apps/infrastructure/ninja/admin_views.py \
            backend/apps/infrastructure/ninja/extended_views.py
          ruff format \
            backend/apps/core/management/commands/seed_infrastructure_development.py \
            backend/apps/core/test_admin_operations_api.py \
            backend/apps/core/test_resource_admin_api.py \
            backend/apps/core/ninja/resource_views.py \
            backend/apps/infrastructure/ninja/admin_views.py \
            backend/apps/infrastructure/ninja/extended_views.py

      - name: Apply frontend formatting
        run: |
          pnpm exec prettier --write \
            sites/admin-adb-software-solutions/src/lib/api/endpoints.ts \
            sites/admin-adb-software-solutions/src/components/ui/ResourceRegister.tsx \
            sites/admin-adb-software-solutions/src/components/ui/index.ts \
            sites/admin-adb-software-solutions/src/components/layout/Sidebar.tsx \
            'sites/admin-adb-software-solutions/src/app/(admin)/admin/credentials/page.tsx' \
            'sites/admin-adb-software-solutions/src/app/(admin)/admin/knowledge-base/page.tsx' \
            'sites/admin-adb-software-solutions/src/app/(admin)/admin/infrastructure/InfrastructureRegisterPage.tsx' \
            'sites/admin-adb-software-solutions/src/app/(admin)/admin/infrastructure/InfrastructureOverview.tsx' \
            'sites/admin-adb-software-solutions/src/app/(admin)/admin/infrastructure/ssl-certificates/page.tsx' \
            'sites/admin-adb-software-solutions/src/app/(admin)/admin/infrastructure/applications/page.tsx' \
            'sites/admin-adb-software-solutions/src/app/(admin)/admin/infrastructure/mobile-apps/page.tsx' \
            'sites/admin-adb-software-solutions/src/app/(admin)/admin/infrastructure/apis/page.tsx' \
            'sites/admin-adb-software-solutions/src/app/(admin)/admin/infrastructure/bots/page.tsx' \
            'sites/admin-adb-software-solutions/src/app/(admin)/admin/infrastructure/email-systems/page.tsx' \
            'sites/admin-adb-software-solutions/src/app/(admin)/admin/infrastructure/tech-stack/page.tsx'

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: Apply repository formatting."
          git push origin HEAD:refactor/admin-operations-ui
