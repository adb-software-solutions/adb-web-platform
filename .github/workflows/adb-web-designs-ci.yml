name: ADB Web Designs Website CI

on:
    push:
        branches: [main]
        paths: &paths
            - "sites/adb-web-designs/**"
            - "packages/**"
            - "Dockerfile.adb-web-designs"
            - "package.json"
            - "pnpm-workspace.yaml"
            - "pnpm-lock.yaml"
            - ".github/workflows/adb-web-designs-ci.yml"
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
        paths: *paths
    workflow_dispatch:

concurrency:
    group: adb-web-designs-ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    frontend:
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        permissions:
            contents: read
            id-token: write
        uses: adb-software-solutions/github-actions-workflows/.github/workflows/frontend-ci.yml@v1
        with:
            pnpm-version: 10.15.0
            working-directory: sites/adb-web-designs
            lockfile: pnpm-lock.yaml
            test-command: pnpm test --passWithNoTests

    trivy:
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        permissions:
            contents: read
        uses: adb-software-solutions/github-actions-workflows/.github/workflows/trivy-fs.yml@v1
        with:
            scan-path: sites/adb-web-designs
            artifact-name: trivy-fs-scan-adb-web-designs

    build:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: [frontend, trivy]
        permissions:
            contents: read
            id-token: write
        uses: adb-software-solutions/github-actions-workflows/.github/workflows/docker-build-push.yml@v1
        with:
            application: adb-web-platform
            images: '["adb-web-designs"]'
            infisical-identity-id: 199f317a-d030-4f03-bbd7-ebf986030b09
            infisical-registry-project-id: 848009f4-aa7d-45e2-8fb6-404bd8f25115
