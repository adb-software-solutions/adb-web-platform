name: Dev Container CI

on:
    push:
        branches: ["main"]
        paths:
            - ".devcontainer/**"
            - ".github/workflows/devcontainer-ci.yml"
    pull_request:
        paths:
            - ".devcontainer/**"
            - ".github/workflows/devcontainer-ci.yml"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: devcontainer-ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build (${{ matrix.architecture }})
        strategy:
            fail-fast: false
            matrix:
                include:
                    - architecture: amd64
                      runner: ubuntu-24.04
                    - architecture: arm64
                      runner: ubuntu-24.04-arm
        runs-on: ${{ matrix.runner }}
        steps:
            - uses: actions/checkout@v4

            - name: Prepare development environment
              run: |
                  cp .devcontainer/.env.example .devcontainer/.env
                  python3 - <<'PY'
                  import base64
                  import secrets
                  from pathlib import Path

                  path = Path(".devcontainer/.env")
                  values = {
                      "SECRET_KEY": secrets.token_urlsafe(64),
                      "CREDENTIAL_ENCRYPTION_KEYS": base64.urlsafe_b64encode(secrets.token_bytes(32)).decode(),
                  }
                  lines = path.read_text().splitlines()
                  for index, line in enumerate(lines):
                      name = line.split("=", 1)[0]
                      if name in values:
                          lines[index] = f"{name}={values[name]}"
                  path.write_text("\n".join(lines) + "\n")
                  PY

            - name: Validate Compose configuration
              run: docker compose -f .devcontainer/docker-compose.yml config >/dev/null

            - name: Validate optional ClamAV image
              run: >-
                  docker compose
                  -f .devcontainer/docker-compose.yml
                  --profile malware-scanning
                  pull clamav

            - name: Build dev container
              uses: devcontainers/ci@v0.3
              with:
                  push: never
