name: ADB Technology Website CI

on:
    push:
        branches: ["main"]
        tags: ["*"]
        paths: &paths
            - "sites/adb-technology/**"
            - "packages/**"
            - "Dockerfile.adb-technology"
            - "package.json"
            - "pnpm-workspace.yaml"
            - "pnpm-lock.yaml"
            - ".github/workflows/adb-technology-ci.yml"
    pull_request:
        paths: *paths
    workflow_dispatch:

concurrency:
    group: adb-technology-ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test-and-build:
        name: Test and Build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4.1.0
              with:
                  version: 10.15.0
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml
            - run: pnpm install --frozen-lockfile
            - run: pnpm --dir sites/adb-technology test --passWithNoTests
            - run: pnpm --dir sites/adb-technology build
    trivy-fs-scan:
        name: Trivy Filesystem Scan
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: aquasecurity/trivy-action@master
              with:
                  scan-type: fs
                  scan-ref: sites/adb-technology
                  severity: HIGH,CRITICAL
                  output: trivy-fs-scan.txt
              env:
                  TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db,public.ecr.aws/aquasecurity/trivy-db
                  TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db,public.ecr.aws/aquasecurity/trivy-java-db
            - uses: actions/upload-artifact@v4
              with:
                  name: trivy-fs-scan-adb-technology
                  path: trivy-fs-scan.txt
    build-and-push:
        name: Build and Push Docker Image
        runs-on: ubuntu-latest
        needs: [test-and-build, trivy-fs-scan]
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        steps:
            - uses: actions/checkout@v4
            - name: Set image tag
              id: meta
              run: echo "tag=${GITHUB_REF_NAME/main/latest}" >> "$GITHUB_OUTPUT"
            - name: Log in to DigitalOcean Container Registry
              run: echo "${{ secrets.DO_REGISTRY_ACCESS_TOKEN }}" | docker login -u "${{ secrets.DO_REGISTRY_USERNAME }}" --password-stdin registry.digitalocean.com
            - run: docker build -f Dockerfile.adb-technology -t registry.digitalocean.com/adbsoftwaresolutions/app-adb-technology:${{ steps.meta.outputs.tag }} .
            - run: docker push registry.digitalocean.com/adbsoftwaresolutions/app-adb-technology:${{ steps.meta.outputs.tag }}
