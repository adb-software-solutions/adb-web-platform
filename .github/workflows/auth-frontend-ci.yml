name: App Name Auth Frontend CI (Monorepo)

on:
    push:
        branches: ["main"]
        tags: ["*"]
        paths:
            - "auth-frontend/**"
            - "Dockerfile.auth-frontend"
            - ".github/workflows/auth-frontend-ci.yml"
            - "tools/**"
            - "pnpm-workspace.yaml"
            - "pnpm-lock.yaml"
            - "package.json"
    pull_request:
        paths:
            - "auth-frontend/**"
            - "Dockerfile.auth-frontend"
            - ".github/workflows/auth-frontend-ci.yml"
            - "tools/**"
            - "pnpm-workspace.yaml"
            - "pnpm-lock.yaml"
            - "package.json"
    workflow_dispatch:

concurrency:
    group: auth-frontend-ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    trivy-fs-scan:
        name: Trivy FS Scan (Auth Frontend)
        runs-on: ubuntu-latest
        if: github.repository != 'adb-software-solutions/project-template'
        steps:
            - uses: actions/checkout@v4
            - name: Run Trivy FS Scan
              uses: aquasecurity/trivy-action@master
              with:
                  scan-type: fs
                  severity: HIGH,CRITICAL
                  output: trivy-fs-scan.txt
              env:
                  TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db,public.ecr.aws/aquasecurity/trivy-db
                  TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db,public.ecr.aws/aquasecurity/trivy-java-db
            - uses: actions/upload-artifact@v4
              with:
                  name: trivy-fs-scan-auth-frontend
                  path: trivy-fs-scan.txt

    run-linters:
        name: Run Linters (root tools/lint)
        runs-on: ubuntu-latest
        if: github.repository != 'adb-software-solutions/project-template'
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
            - uses: pnpm/action-setup@v4.1.0
              with:
                  version: 10.15.0
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "pnpm"
                  cache-dependency-path: pnpm-lock.yaml
            - name: Install Node dependencies
              run: pnpm install --no-frozen-lockfile
            - name: Add Node binaries to PATH
              run: |
                  echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
                  echo "$GITHUB_WORKSPACE/admin-website/node_modules/.bin" >> "$GITHUB_PATH"
                  echo "$GITHUB_WORKSPACE/auth-frontend/node_modules/.bin" >> "$GITHUB_PATH"
                  echo "$GITHUB_WORKSPACE/sites/adb-software-solutions/node_modules/.bin" >> "$GITHUB_PATH"
                  echo "$GITHUB_WORKSPACE/sites/adb-web-designs/node_modules/.bin" >> "$GITHUB_PATH"
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - name: Install Python tooling deps
              run: pip install -r backend/requirements/dev.txt
            - name: Install Shell tooling
              run: |
                  tools/setup/install-shellcheck
                  tools/setup/install-shfmt
            - name: Fetch main for comparison
              run: git fetch origin main
            - name: Run all linters (root)
              run: tools/lint

    run-tests:
        name: Run Tests
        runs-on: ubuntu-latest
        if: github.repository != 'adb-software-solutions/project-template'
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4.1.0
              with:
                  version: 10.15.0
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "pnpm"
                  cache-dependency-path: pnpm-lock.yaml
            - name: Install Node dependencies
              run: pnpm install --no-frozen-lockfile
            - name: Run auth-frontend tests
              working-directory: auth-frontend
              run: pnpm test --passWithNoTests

    build-and-analyze:
        name: Build and Bundle Analysis
        runs-on: ubuntu-latest
        needs: [run-linters, run-tests]
        if: github.repository != 'adb-software-solutions/project-template'
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: pnpm/action-setup@v4.1.0
              with:
                  version: 10.15.0
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "pnpm"
                  cache-dependency-path: pnpm-lock.yaml
            - name: Install Node dependencies
              run: pnpm install --no-frozen-lockfile
            - name: Build auth-frontend for analysis
              working-directory: auth-frontend
              run: pnpm run build
              timeout-minutes: 5
            - name: Upload bundle analysis to Codecov
              if: ${{ github.event_name == 'push' }}
              uses: codecov/codecov-action@v4
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  plugin: bundler
                  flags: auth-frontend
                  name: Auth Frontend Bundle Analysis
                  directory: ./auth-frontend/dist
                  fail_ci_if_error: false
                  verbose: true

    build-and-push-image:
        name: Build and Push Docker Image
        runs-on: ubuntu-latest
        needs: [run-linters, trivy-fs-scan, build-and-analyze]
        if: github.repository != 'adb-software-solutions/project-template' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        steps:
            - uses: actions/checkout@v4
            - name: Set tag suffix
              id: meta
              run: |
                  if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
                    TAG="${GITHUB_REF##refs/tags/}"
                    echo "tag_suffix=${TAG}" >> $GITHUB_OUTPUT
                  else
                    echo "tag_suffix=latest" >> $GITHUB_OUTPUT
                  fi
            - name: Log in to DigitalOcean Container Registry
              run: echo "${{ secrets.DO_REGISTRY_ACCESS_TOKEN }}" | docker login -u ${{ secrets.DO_REGISTRY_USERNAME }} --password-stdin registry.digitalocean.com
            - name: Build Docker Image
              run: |
                  docker build \
                    -f Dockerfile.auth-frontend \
                    -t registry.digitalocean.com/adbsoftwaresolutions/app-auth-frontend:${{ steps.meta.outputs.tag_suffix }} \
                    .
            - name: Push Docker Image
              run: docker push registry.digitalocean.com/adbsoftwaresolutions/app-auth-frontend:${{ steps.meta.outputs.tag_suffix }}

    scan-docker-image:
        name: Trivy Image Scan (Auth Frontend)
        runs-on: ubuntu-latest
        needs: build-and-push-image
        if: github.repository != 'adb-software-solutions/project-template' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        steps:
            - uses: actions/checkout@v4
            - name: Set tag suffix
              id: meta
              run: |
                  if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
                    TAG="${GITHUB_REF##refs/tags/}"
                    echo "tag_suffix=${TAG}" >> $GITHUB_OUTPUT
                  else
                    echo "tag_suffix=latest" >> $GITHUB_OUTPUT
                  fi
            - name: Run Trivy Docker Image Scan
              uses: aquasecurity/trivy-action@0.29.0
              with:
                  scan-type: image
                  image-ref: registry.digitalocean.com/adbsoftwaresolutions/app-auth-frontend:${{ steps.meta.outputs.tag_suffix }}
                  severity: HIGH,CRITICAL
                  output: trivy-image-scan.txt
              env:
                  TRIVY_USERNAME: ${{ secrets.DO_REGISTRY_USERNAME }}
                  TRIVY_PASSWORD: ${{ secrets.DO_REGISTRY_ACCESS_TOKEN }}
            - uses: actions/upload-artifact@v4
              with:
                  name: trivy-docker-image-scan-auth-frontend
                  path: trivy-image-scan.txt
