name: App Name Backend CI (Monorepo)

on:
    push:
        branches: ["main"]
        tags: ["*"]
        paths:
            - "backend/**"
            - "Dockerfile.backend"
            - "Dockerfile.flower"
            - "Dockerfile.celery-worker"
            - "Dockerfile.celery-beat"
            - "entrypoint-flower.sh"
            - "entrypoint-celery-worker.sh"
            - "entrypoint.sh"
            - "tools/**"
            - "package.json"
            - "pnpm-workspace.yaml"
            - "pnpm-lock.yaml"
            - ".github/workflows/backend-ci.yml"
    pull_request:
        paths:
            - "backend/**"
            - "Dockerfile.backend"
            - "Dockerfile.flower"
            - "Dockerfile.celery-worker"
            - "Dockerfile.celery-beat"
            - "entrypoint-flower.sh"
            - "entrypoint-celery-worker.sh"
            - "entrypoint.sh"
            - "tools/**"
            - "package.json"
            - "pnpm-workspace.yaml"
            - "pnpm-lock.yaml"
            - ".github/workflows/backend-ci.yml"
    workflow_dispatch:

concurrency:
    group: backend-ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    tests-and-linters:
        name: Run Tests and Linters
        runs-on: ubuntu-latest
        if: github.repository != 'adb-software-solutions/project-template'
        services:
            postgres:
                image: postgres:14.4
                env:
                    POSTGRES_DB: app_dev
                    POSTGRES_USER: user
                    POSTGRES_PASSWORD: pass
                ports: ["5432:5432"]
                options: >-
                    --health-cmd="pg_isready -U user"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5
            redis:
                image: redis:7.0.4
                ports: ["6379:6379"]
        env:
            SQL_ENGINE: django.db.backends.postgresql
            SQL_DATABASE: app_dev
            SQL_USER: user
            SQL_PASSWORD: pass
            SQL_HOST: localhost
            SQL_PORT: 5432
            SECRET_KEY: test
            DEBUG: 1
            DEBUG_TOOLBAR_ENABLED: 0
            SITE_DOMAIN: testserver
            SESSION_BACKEND_URL: redis://localhost:6379/1
            CACHE_BACKEND_URL: redis://localhost:6379/2
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - uses: pnpm/action-setup@v4.1.0
              with:
                  version: 10.15.0
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "pnpm"
                  cache-dependency-path: pnpm-lock.yaml
            - name: Install Node dependencies
              run: pnpm install --no-frozen-lockfile
            - name: Add Node binaries to PATH
              run: |
                  echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
                  echo "$GITHUB_WORKSPACE/admin-website/node_modules/.bin" >> "$GITHUB_PATH"
                  echo "$GITHUB_WORKSPACE/auth-frontend/node_modules/.bin" >> "$GITHUB_PATH"
                  echo "$GITHUB_WORKSPACE/sites/adb-software-solutions/node_modules/.bin" >> "$GITHUB_PATH"
                  echo "$GITHUB_WORKSPACE/sites/adb-web-designs/node_modules/.bin" >> "$GITHUB_PATH"
            - name: Cache pip
              uses: actions/cache@v4
              with:
                  path: ~/.cache/pip
                  key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements/*.txt') }}
                  restore-keys: ${{ runner.os }}-pip-
            - name: Install Python dependencies
              run: pip install -r backend/requirements/dev.txt
            - name: Run Django tests
              working-directory: backend
              run: DJANGO_SETTINGS_MODULE=adbsoftwaresolutions.settings_test coverage run manage.py test -v 2
            - name: Generate coverage file
              working-directory: backend
              run: coverage xml
            - name: Install Shellcheck + shfmt
              run: |
                  tools/setup/install-shellcheck
                  tools/setup/install-shfmt
            - name: Run linters (root tools/lint)
              run: tools/lint
            - name: Upload coverage to Codecov
              if: ${{ github.repository == 'adb-software-solutions/app' && github.event_name == 'push' }}
              uses: codecov/codecov-action@v4
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: ./backend/coverage.xml
                  flags: backend,unittests
                  name: Backend Coverage
                  fail_ci_if_error: true
                  verbose: true

    trivy-fs-scan:
        name: Trivy FS Scan (Backend + Root)
        runs-on: ubuntu-latest
        if: github.repository != 'adb-software-solutions/project-template'
        steps:
            - uses: actions/checkout@v4
            - name: Trivy FS Scan
              uses: aquasecurity/trivy-action@master
              with:
                  scan-type: fs
                  severity: HIGH,CRITICAL
                  output: trivy-fs-scan.txt
              env:
                  TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db,public.ecr.aws/aquasecurity/trivy-db
                  TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db,public.ecr.aws/aquasecurity/trivy-java-db
            - uses: actions/upload-artifact@v4
              with:
                  name: trivy-fs-scan-backend
                  path: trivy-fs-scan.txt

    build-and-push:
        name: Build and Push Backend Images
        runs-on: ubuntu-latest
        needs: [tests-and-linters, trivy-fs-scan]
        if: github.repository != 'adb-software-solutions/project-template' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        strategy:
            matrix:
                image:
                    - backend
                    - flower
                    - celery-worker
                    - celery-beat
        steps:
            - uses: actions/checkout@v4
            - name: Log in to DigitalOcean Container Registry
              run: echo "${{ secrets.DO_REGISTRY_ACCESS_TOKEN }}" | docker login -u ${{ secrets.DO_REGISTRY_USERNAME }} --password-stdin registry.digitalocean.com
            - name: Build and push ${{ matrix.image }}
              run: |
                  docker build -f Dockerfile.${{ matrix.image }} -t registry.digitalocean.com/adbsoftwaresolutions/app-${{ matrix.image }}:latest .
                  docker push registry.digitalocean.com/adbsoftwaresolutions/app-${{ matrix.image }}:latest

    trivy-image-scan:
        name: Trivy Image Scan (Backend)
        runs-on: ubuntu-latest
        needs: build-and-push
        if: github.repository != 'adb-software-solutions/project-template' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        strategy:
            matrix:
                image:
                    - backend
                    - flower
                    - celery-worker
                    - celery-beat
        steps:
            - name: Scan registry.digitalocean.com/adbsoftwaresolutions/app-${{ matrix.image }}:latest
              uses: aquasecurity/trivy-action@0.29.0
              with:
                  scan-type: image
                  image-ref: registry.digitalocean.com/adbsoftwaresolutions/app-${{ matrix.image }}:latest
                  severity: HIGH,CRITICAL
                  output: trivy-${{ matrix.image }}-scan.txt
              env:
                  TRIVY_USERNAME: ${{ secrets.DO_REGISTRY_USERNAME }}
                  TRIVY_PASSWORD: ${{ secrets.DO_REGISTRY_ACCESS_TOKEN }}
            - uses: actions/upload-artifact@v4
              with:
                  name: trivy-image-scan-${{ matrix.image }}
                  path: trivy-${{ matrix.image }}-scan.txt
