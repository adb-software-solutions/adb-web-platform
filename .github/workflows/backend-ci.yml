name: Backend CI

on:
    push:
        branches: [main]
        paths:
            - "backend/**"
            - "Dockerfile.backend"
            - "Dockerfile.flower"
            - "Dockerfile.celery-worker"
            - "Dockerfile.celery-beat"
            - "entrypoint-flower.sh"
            - "entrypoint-celery-worker.sh"
            - "entrypoint.sh"
            - ".github/workflows/backend-ci.yml"
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
        paths:
            - "backend/**"
            - "Dockerfile.backend"
            - "Dockerfile.flower"
            - "Dockerfile.celery-worker"
            - "Dockerfile.celery-beat"
            - "entrypoint-flower.sh"
            - "entrypoint-celery-worker.sh"
            - "entrypoint.sh"
            - ".github/workflows/backend-ci.yml"
    workflow_dispatch:

concurrency:
    group: backend-ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    django:
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        permissions:
            contents: read
            id-token: write
        uses: adb-software-solutions/github-actions-workflows/.github/workflows/django-ci.yml@v1
        with:
            django-settings-module: adbsoftwaresolutions.settings_test
            database-name: app_dev

    trivy:
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        permissions:
            contents: read
        uses: adb-software-solutions/github-actions-workflows/.github/workflows/trivy-fs.yml@v1
        with:
            artifact-name: trivy-fs-scan-backend

    build:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: [django, trivy]
        permissions:
            contents: read
            id-token: write
        uses: adb-software-solutions/github-actions-workflows/.github/workflows/docker-build-push.yml@v1
        with:
            application: adb-web-platform
            images: '["backend","flower","celery-worker","celery-beat"]'
            infisical-identity-id: 199f317a-d030-4f03-bbd7-ebf986030b09
            infisical-registry-project-id: 848009f4-aa7d-45e2-8fb6-404bd8f25115
