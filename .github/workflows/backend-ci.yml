name: Backend CI

on:
    push:
        branches: ["main"]
        tags: ["*"]
        paths:
            - "backend/**"
            - "Dockerfile.backend"
            - "Dockerfile.flower"
            - "Dockerfile.celery-worker"
            - "Dockerfile.celery-beat"
            - "entrypoint-flower.sh"
            - "entrypoint-celery-worker.sh"
            - "entrypoint.sh"
            - ".github/workflows/backend-ci.yml"
    pull_request:
        paths:
            - "backend/**"
            - "Dockerfile.backend"
            - "Dockerfile.flower"
            - "Dockerfile.celery-worker"
            - "Dockerfile.celery-beat"
            - "entrypoint-flower.sh"
            - "entrypoint-celery-worker.sh"
            - "entrypoint.sh"
            - ".github/workflows/backend-ci.yml"
    workflow_dispatch:

concurrency:
    group: backend-ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    tests:
        name: Django Tests
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:14.4
                env:
                    POSTGRES_DB: app_dev
                    POSTGRES_USER: user
                    POSTGRES_PASSWORD: pass
                ports: ["5432:5432"]
                options: >-
                    --health-cmd="pg_isready -U user"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5
            redis:
                image: redis:7.0.4
                ports: ["6379:6379"]
        env:
            SQL_ENGINE: django.db.backends.postgresql
            SQL_DATABASE: app_dev
            SQL_USER: user
            SQL_PASSWORD: pass
            SQL_HOST: localhost
            SQL_PORT: 5432
            SECRET_KEY: test
            DEBUG: 1
            DEBUG_TOOLBAR_ENABLED: 0
            SITE_DOMAIN: testserver
            SESSION_BACKEND_URL: redis://localhost:6379/1
            CACHE_BACKEND_URL: redis://localhost:6379/2
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: backend/requirements/dev.txt
            - name: Install Python dependencies
              run: pip install -r backend/requirements/dev.txt
            - name: Run Django tests
              working-directory: backend
              run: DJANGO_SETTINGS_MODULE=adbsoftwaresolutions.settings_test coverage run manage.py test -v 2
            - name: Generate coverage file
              working-directory: backend
              run: coverage xml
            - name: Upload coverage to Codecov
              if: ${{ github.event_name == 'push' }}
              uses: codecov/codecov-action@v4
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: ./backend/coverage.xml
                  flags: backend,unittests
                  name: Backend Coverage
                  fail_ci_if_error: false

    trivy-fs-scan:
        name: Trivy Filesystem Scan
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: aquasecurity/trivy-action@master
              with:
                  scan-type: fs
                  severity: HIGH,CRITICAL
                  output: trivy-fs-scan.txt
              env:
                  TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db,public.ecr.aws/aquasecurity/trivy-db
                  TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db,public.ecr.aws/aquasecurity/trivy-java-db
            - uses: actions/upload-artifact@v4
              with:
                  name: trivy-fs-scan-backend
                  path: trivy-fs-scan.txt

    docker-build:
        name: Docker Build
        runs-on: ubuntu-latest
        needs: [tests, trivy-fs-scan]
        strategy:
            matrix:
                image: [backend, flower, celery-worker, celery-beat]
        steps:
            - uses: actions/checkout@v4
            - name: Build ${{ matrix.image }}
              run: docker build -f Dockerfile.${{ matrix.image }} -t adb-web-platform/${{ matrix.image }}:ci .
