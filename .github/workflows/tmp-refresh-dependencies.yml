name: Temporary Dependency Refresh

on:
    push:
        branches:
            - tmp/dependabot-refresh

permissions:
    contents: write

jobs:
    refresh:
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout branch
              uses: actions/checkout@v4
              with:
                  ref: tmp/dependabot-refresh

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Update Python requirement inputs
              run: |
                  python - <<'PY'
                  from pathlib import Path

                  replacements = {
                      "backend/requirements/common.in": {
                          "Django==6.0.7": "Django==6.0.8",
                          "psycopg2==2.9.10": "psycopg2==2.9.12",
                          "uvicorn[standard]==0.35.0": "uvicorn[standard]==0.52.3",
                          "django-debug-toolbar==7.1.0": "django-debug-toolbar==7.1.1",
                          "django-cors-headers==4.7.0": "django-cors-headers==4.9.0",
                          "tenacity==9.1.2": "tenacity==9.1.4",
                          "django-unfold==0.102.0": "django-unfold==0.104.1",
                          "cairosvg==2.8.2": "cairosvg==2.9.0",
                          "requests==2.32.4": "requests==2.34.2",
                          "cryptography==49.0.0": "cryptography==50.0.0",
                      },
                      "backend/requirements/dev.in": {
                          "typing-extensions==4.14.1": "typing-extensions==4.16.0",
                          "codespell==2.4.1": "codespell==2.4.3",
                          "coverage==7.10.3": "coverage==7.15.4",
                      },
                      "backend/requirements/mypy.in": {
                          "mypy==1.17.1": "mypy==2.3.1",
                      },
                  }

                  for filename, changes in replacements.items():
                      path = Path(filename)
                      content = path.read_text()
                      for old, new in changes.items():
                          count = content.count(old)
                          if count != 1:
                              raise SystemExit(
                                  f"Expected exactly one {old!r} in {filename}, found {count}"
                              )
                          content = content.replace(old, new)
                      path.write_text(content)
                  PY

            - name: Regenerate Python requirement locks
              run: |
                  python -m pip install --disable-pip-version-check pip-tools==7.6.1

                  compile_requirements() {
                      local source="$1"
                      local output="$2"
                      pip-compile \
                        --quiet \
                        --resolver=backtracking \
                        --allow-unsafe \
                        --generate-hashes \
                        --no-strip-extras \
                        --output-file "$output" \
                        "$source"
                      chmod a+r "$output"
                  }

                  compile_requirements \
                    backend/requirements/dev.in \
                    backend/requirements/dev.txt

                  cp backend/requirements/dev.txt backend/requirements/prod.txt
                  compile_requirements \
                    backend/requirements/prod.in \
                    backend/requirements/prod.txt

                  cp backend/requirements/dev.txt backend/requirements/mypy.txt
                  compile_requirements \
                    backend/requirements/mypy.in \
                    backend/requirements/mypy.txt

            - name: Set up pnpm
              uses: pnpm/action-setup@v4.1.0
              with:
                  version: 10.15.0

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml

            - name: Update workspace dependencies
              run: |
                  pnpm --recursive update \
                    "@eslint/js@10.0.1" \
                    "@icons-pack/react-simple-icons@13.13.0" \
                    "@testing-library/jest-dom@7.0.1" \
                    "@types/node@26.2.0" \
                    "eslint-plugin-react-hooks@7.1.1" \
                    "jsdom@30.0.1" \
                    "katex@0.18.4" \
                    "lucide-react@1.31.0" \
                    "react-easy-crop@6.2.3" \
                    "react-markdown@10.1.0" \
                    "typescript@7.0.2"

                  pnpm --workspace-root update \
                    "eslint-plugin-unicorn@65.0.1"

                  pnpm install --lockfile-only

            - name: Commit refreshed dependencies
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add \
                    backend/requirements/common.in \
                    backend/requirements/dev.in \
                    backend/requirements/mypy.in \
                    backend/requirements/dev.txt \
                    backend/requirements/prod.txt \
                    backend/requirements/mypy.txt \
                    package.json \
                    pnpm-lock.yaml \
                    sites/*/package.json \
                    packages/*/package.json
                  if git diff --cached --quiet; then
                      echo "No dependency changes produced."
                      exit 0
                  fi
                  git commit -m "deps: Refresh Dependabot updates."
                  git push origin HEAD:tmp/dependabot-refresh
