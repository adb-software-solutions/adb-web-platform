name: Repository Copilot Setup

on:
    workflow_dispatch:
    push:
        paths:
            - .github/workflows/copilot-setup-steps.yml
            - backend/**
            - sites/**
            - packages/**
            - package.json
            - pnpm-workspace.yaml
            - pnpm-lock.yaml
    pull_request:
        paths:
            - .github/workflows/copilot-setup-steps.yml
            - backend/**
            - sites/**
            - packages/**
            - package.json
            - pnpm-workspace.yaml
            - pnpm-lock.yaml

jobs:
    setup:
        name: Validate Development Setup
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:14.4
                env:
                    POSTGRES_DB: app_dev
                    POSTGRES_USER: user
                    POSTGRES_PASSWORD: pass
                ports: ["5432:5432"]
            redis:
                image: redis:7.0.4
                ports: ["6379:6379"]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: backend/requirements/dev.txt
            - run: pip install -r backend/requirements/dev.txt
            - uses: pnpm/action-setup@v4.1.0
              with:
                  version: 10.15.0
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml
            - run: pnpm install --frozen-lockfile
            - name: Install shell tooling
              run: |
                  tools/setup/install-shellcheck
                  tools/setup/install-shfmt
