name: Format Admin Operations

on:
  push:
    branches:
      - refactor/admin-operations-ui

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: refactor/admin-operations-ui
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff==0.12.11

      - name: Apply Ruff fixes and formatting
        run: |
          ruff check --fix \
            backend/apps/clients/ninja/admin_views.py \
            backend/apps/core/management/commands/seed_development.py \
            backend/apps/core/ninja/admin_views.py \
            backend/apps/core/ownership.py \
            backend/apps/crm/ninja/admin_views.py \
            backend/apps/tasks/models.py \
            backend/apps/tasks/ninja/admin_views.py
          ruff format \
            backend/apps/clients/ninja/admin_views.py \
            backend/apps/core/management/commands/seed_development.py \
            backend/apps/core/ninja/admin_views.py \
            backend/apps/core/ownership.py \
            backend/apps/crm/ninja/admin_views.py \
            backend/apps/tasks/models.py \
            backend/apps/tasks/ninja/admin_views.py

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/apps/clients/ninja/admin_views.py \
            backend/apps/core/management/commands/seed_development.py \
            backend/apps/core/ninja/admin_views.py \
            backend/apps/core/ownership.py \
            backend/apps/crm/ninja/admin_views.py \
            backend/apps/tasks/models.py \
            backend/apps/tasks/ninja/admin_views.py
          git commit -m "style: Apply Ruff formatting."
          git push origin HEAD:refactor/admin-operations-ui
