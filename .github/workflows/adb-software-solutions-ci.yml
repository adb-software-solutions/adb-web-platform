name: ADB Software Solutions CI

on:
    push:
        branches: [main]
        paths: &paths
            - "sites/adb-software-solutions/**"
            - "packages/**"
            - "Dockerfile.adb-software-solutions"
            - "package.json"
            - "pnpm-workspace.yaml"
            - "pnpm-lock.yaml"
            - ".github/workflows/adb-software-solutions-ci.yml"
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
        paths: *paths
    workflow_dispatch:

concurrency:
    group: adb-software-solutions-ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    frontend:
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        permissions:
            contents: read
        uses: adb-software-solutions/github-actions-workflows/.github/workflows/frontend-ci.yml@v1
        with:
            pnpm-version: 10.15.0
            working-directory: sites/adb-software-solutions
            lockfile: pnpm-lock.yaml
            test-command: pnpm test --passWithNoTests

    trivy:
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        permissions:
            contents: read
        uses: adb-software-solutions/github-actions-workflows/.github/workflows/trivy-fs.yml@v1
        with:
            scan-path: sites/adb-software-solutions
            artifact-name: trivy-fs-scan-adb-software-solutions

    build:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: [frontend, trivy]
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7

            - name: Generate production environment
              run: |
                  {
                    echo "NEXT_PUBLIC_GTM_ID=${NEXT_PUBLIC_GTM_ID}";
                    echo "NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}";
                  } > sites/adb-software-solutions/.ci.env
              env:
                  NEXT_PUBLIC_GTM_ID: ${{ secrets.NEXT_PUBLIC_GTM_ID }}
                  NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

            - name: Log in to DigitalOcean Container Registry
              run: echo "${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}" | docker login -u doctl --password-stdin registry.digitalocean.com

            - name: Build and push Docker image
              run: |
                  image="registry.digitalocean.com/${{ vars.DO_REGISTRY_NAME }}/adb-web-platform-adb-software-solutions"
                  docker build \
                    -f Dockerfile.adb-software-solutions \
                    -t "${image}:${GITHUB_SHA}" \
                    -t "${image}:latest" \
                    .
                  docker push "${image}:${GITHUB_SHA}"
                  docker push "${image}:latest"

            - name: Scan immutable Docker image
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                  scan-type: image
                  image-ref: registry.digitalocean.com/${{ vars.DO_REGISTRY_NAME }}/adb-web-platform-adb-software-solutions:${{ github.sha }}
                  severity: HIGH,CRITICAL
                  output: trivy-adb-software-solutions-image-scan.txt
              env:
                  TRIVY_USERNAME: doctl
                  TRIVY_PASSWORD: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

            - name: Upload Docker image scan
              uses: actions/upload-artifact@v6
              with:
                  name: trivy-image-scan-adb-software-solutions
                  path: trivy-adb-software-solutions-image-scan.txt
