name: ADB Software Solutions Website CI

on:
    push:
        branches: ["main"]
        tags: ["*"]
        paths: &paths
            - "sites/adb-software-solutions/**"
            - "packages/**"
            - "Dockerfile.adb-software-solutions"
            - "package.json"
            - "pnpm-workspace.yaml"
            - "pnpm-lock.yaml"
            - ".github/workflows/adb-software-solutions-ci.yml"
    pull_request:
        paths: *paths
    workflow_dispatch:

concurrency:
    group: adb-software-solutions-ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test-and-build:
        name: Test and Build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4.1.0
              with:
                  version: 10.15.0
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml
            - run: pnpm install --frozen-lockfile
            - run: pnpm --dir sites/adb-software-solutions test --passWithNoTests
            - run: pnpm --dir sites/adb-software-solutions build
    trivy-fs-scan:
        name: Trivy Filesystem Scan
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: aquasecurity/trivy-action@master
              with:
                  scan-type: fs
                  scan-ref: sites/adb-software-solutions
                  severity: HIGH,CRITICAL
                  output: trivy-fs-scan.txt
              env:
                  TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db,public.ecr.aws/aquasecurity/trivy-db
                  TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db,public.ecr.aws/aquasecurity/trivy-java-db
            - uses: actions/upload-artifact@v4
              with:
                  name: trivy-fs-scan-adb-software-solutions
                  path: trivy-fs-scan.txt
    docker-build:
        name: Docker Build and Push
        runs-on: ubuntu-latest
        needs: [test-and-build, trivy-fs-scan]
        steps:
            - uses: actions/checkout@v4
            - name: Build Docker image
              run: docker build -f Dockerfile.adb-software-solutions -t adb-web-platform/adb-software-solutions:ci .
            - name: Set image tag
              if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
              id: meta
              shell: bash
              run: |
                  if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
                    echo "tag=latest" >> "$GITHUB_OUTPUT"
                  else
                    echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
                  fi
            - name: Install doctl
              if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
              uses: digitalocean/action-doctl@v2
              with:
                  token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
            - name: Log in to DigitalOcean Container Registry
              if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
              run: doctl registries login "${{ vars.DO_REGISTRY_NAME }}" --expiry-seconds 1200
            - name: Push Docker image
              if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
              run: |
                  image="registry.digitalocean.com/${{ vars.DO_REGISTRY_NAME }}/app-adb-software-solutions:${{ steps.meta.outputs.tag }}"
                  docker tag adb-web-platform/adb-software-solutions:ci "$image"
                  docker push "$image"
