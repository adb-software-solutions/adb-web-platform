name: Production Deployment

on:
    push:
        branches: [deploy]
    workflow_dispatch:

jobs:
    deploy:
        name: Deploy Full Stack
        runs-on: ubuntu-latest
        if: github.repository != 'adb-software-solutions/project-template' && github.ref == 'refs/heads/deploy'
        container:
            image: adbsoftwaresolutions/ansible-runner:latest
            options: --user root
            env:
                HOME: /root
        steps:
            - name: Checkout deploy repository
              uses: actions/checkout@v4
              with:
                  repository: adb-software-solutions/adb-deploy
                  token: ${{ secrets.DEPLOY_REPO_PAT }}
            - name: Set up SSH
              run: |
                  mkdir -p /root/.ssh
                  echo "${{ secrets.DEPLOY_SSH_KEY }}" > /root/.ssh/id_ed25519
                  chmod 600 /root/.ssh/id_ed25519
                  ssh-keyscan -p 1999 206.189.28.66 >> /root/.ssh/known_hosts
            - name: Install Ansible collections
              run: ansible-galaxy collection install -r requirements.yml
            - name: Deploy full stack
              run: |
                  ansible-playbook site.yml -i inventories/production/hosts.ini \
                    --extra-vars "site=project-template" \
                    --extra-vars "cloudflare_api_token=${{ secrets.CLOUDFLARE_API_TOKEN }}" \
                    --extra-vars "backend_secret_key=${{ secrets.BACKEND_SECRET_KEY }}" \
                    --extra-vars "db_name=${{ secrets.DB_NAME }}" \
                    --extra-vars "db_user=${{ secrets.DB_USER }}" \
                    --extra-vars "db_password=${{ secrets.DB_PASSWORD }}"
