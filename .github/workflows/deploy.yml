name: Deploy ADB Web Platform to Production

on:
    push:
        branches: [deploy]
    workflow_dispatch:
        inputs:
            image_tag:
                description: Leave empty to build and deploy this commit; a full Git SHA redeploys that image (rollback)
                required: false
                default: ""
                type: string

permissions:
    contents: read
    id-token: write

jobs:
    deploy:
        name: Deploy ADB Web Platform to Production
        uses: adb-software-solutions/github-actions-workflows/.github/workflows/deploy-application.yml@v1
        with:
            application: adb-web-platform
            image-tag: ${{ inputs.image_tag }}
            infisical-registry-project-id: 848009f4-aa7d-45e2-8fb6-404bd8f25115
            # Built from this commit and deployed by its SHA (build-on-deploy).
            build-images: >-
                [{"image": "adb-software-solutions", "build-env-file": "sites/adb-software-solutions/.ci.env", "optional-build-env-keys": ["NEXT_PUBLIC_API_URL", "NEXT_PUBLIC_AUTH_URL", "NEXT_PUBLIC_SITE_URL"]},
                "adb-technology",
                "adb-web-designs",
                {"image": "analytics-adb-software-solutions", "build-env-file": "sites/analytics-adb-software-solutions/.ci.env", "optional-build-env-keys": ["NEXT_PUBLIC_API_URL", "NEXT_PUBLIC_APP_URL", "NEXT_PUBLIC_AUTH_URL", "NEXT_PUBLIC_ANALYTICS_URL", "NEXT_PUBLIC_WEB_DESIGNS_URL", "NEXT_PUBLIC_TECHNOLOGY_URL"]},
                {"image": "auth-adb-software-solutions", "build-env-file": "sites/auth-adb-software-solutions/.ci.env", "optional-build-env-keys": ["NEXT_PUBLIC_API_URL", "NEXT_PUBLIC_APP_URL", "NEXT_PUBLIC_AUTH_URL", "NEXT_PUBLIC_WEB_DESIGNS_URL", "NEXT_PUBLIC_TECHNOLOGY_URL", "NEXT_PUBLIC_ANALYTICS_URL"]},
                "backend",
                "celery-worker",
                "celery-beat"]
            infisical-identity-id: f2517025-8db2-45fa-9df5-a9dce1a5e1f6
            infisical-application-project-id: 51df9308-efb3-45b0-94ed-bf641f076acf
            infisical-deployment-bootstrap-project-id: a1f87e48-bbea-4952-9498-723c15ba8c38
            infisical-infrastructure-project-id: d39c5ad0-b79f-4f12-b081-9aec36fdca8e
