name: Admin Website CI

on:
    push:
        branches: ["main"]
        tags: ["*"]
        paths:
            - "admin-website/**"
            - "Dockerfile.admin-website"
            - ".github/workflows/admin-website-ci.yml"
            - "tools/**"
            - "package.json"
            - "pnpm-workspace.yaml"
            - "pnpm-lock.yaml"
    pull_request:
        paths:
            - "admin-website/**"
            - "Dockerfile.admin-website"
            - ".github/workflows/admin-website-ci.yml"
            - "tools/**"
            - "package.json"
            - "pnpm-workspace.yaml"
            - "pnpm-lock.yaml"
    workflow_dispatch:

concurrency:
    group: admin-website-ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    trivy-fs-scan:
        name: Trivy FS Scan
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Run Trivy FS Scan
              uses: aquasecurity/trivy-action@master
              with:
                  scan-type: fs
                  severity: HIGH,CRITICAL
                  output: trivy-fs-scan.txt
              env:
                  TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db,public.ecr.aws/aquasecurity/trivy-db
                  TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db,public.ecr.aws/aquasecurity/trivy-java-db
            - uses: actions/upload-artifact@v4
              with:
                  name: trivy-fs-scan-admin-website
                  path: trivy-fs-scan.txt

    run-linters:
        name: Run Linters
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
            - uses: pnpm/action-setup@v4.1.0
              with:
                  version: 10.15.0
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "pnpm"
                  cache-dependency-path: pnpm-lock.yaml
            - name: Install Node dependencies
              run: pnpm install --no-frozen-lockfile
            - name: Add Node binaries to PATH
              run: |
                  echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
                  echo "$GITHUB_WORKSPACE/admin-website/node_modules/.bin" >> "$GITHUB_PATH"
                  echo "$GITHUB_WORKSPACE/auth-frontend/node_modules/.bin" >> "$GITHUB_PATH"
                  echo "$GITHUB_WORKSPACE/sites/adb-software-solutions/node_modules/.bin" >> "$GITHUB_PATH"
                  echo "$GITHUB_WORKSPACE/sites/adb-web-designs/node_modules/.bin" >> "$GITHUB_PATH"
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - name: Install Python tooling
              run: pip install -r backend/requirements/dev.txt
            - name: Install shell tooling
              run: |
                  tools/setup/install-shellcheck
                  tools/setup/install-shfmt
            - name: Fetch main for comparison
              run: git fetch origin main
            - name: Run repository linters
              run: tools/lint

    run-tests:
        name: Run Tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4.1.0
              with:
                  version: 10.15.0
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "pnpm"
                  cache-dependency-path: pnpm-lock.yaml
            - name: Install Node dependencies
              run: pnpm install --no-frozen-lockfile
            - name: Run tests
              working-directory: admin-website
              run: pnpm test --passWithNoTests
            - name: Build admin website
              working-directory: admin-website
              run: pnpm run build

    build-and-push-image:
        name: Build and Push Docker Image
        runs-on: ubuntu-latest
        needs: [trivy-fs-scan, run-linters, run-tests]
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        steps:
            - uses: actions/checkout@v4
            - name: Set tag suffix
              id: meta
              run: |
                  if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
                    echo "tag_suffix=${GITHUB_REF##refs/tags/}" >> "$GITHUB_OUTPUT"
                  else
                    echo "tag_suffix=latest" >> "$GITHUB_OUTPUT"
                  fi
            - name: Generate production environment
              run: |
                  {
                    echo "NEXT_PUBLIC_GTM_ID=${NEXT_PUBLIC_GTM_ID}";
                    echo "NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}";
                  } > ./admin-website/.ci.env
              env:
                  NEXT_PUBLIC_GTM_ID: ${{ secrets.NEXT_PUBLIC_GTM_ID }}
                  NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
            - name: Log in to DigitalOcean Container Registry
              run: echo "${{ secrets.DO_REGISTRY_ACCESS_TOKEN }}" | docker login -u "${{ secrets.DO_REGISTRY_USERNAME }}" --password-stdin registry.digitalocean.com
            - name: Build Docker image
              run: |
                  docker build \
                    -f Dockerfile.admin-website \
                    -t registry.digitalocean.com/adbsoftwaresolutions/app-admin-website:${{ steps.meta.outputs.tag_suffix }} \
                    .
            - name: Push Docker image
              run: docker push registry.digitalocean.com/adbsoftwaresolutions/app-admin-website:${{ steps.meta.outputs.tag_suffix }}

    scan-docker-image:
        name: Trivy Image Scan
        runs-on: ubuntu-latest
        needs: build-and-push-image
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        steps:
            - name: Set tag suffix
              id: meta
              run: |
                  if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
                    echo "tag_suffix=${GITHUB_REF##refs/tags/}" >> "$GITHUB_OUTPUT"
                  else
                    echo "tag_suffix=latest" >> "$GITHUB_OUTPUT"
                  fi
            - name: Run Trivy image scan
              uses: aquasecurity/trivy-action@0.29.0
              with:
                  scan-type: image
                  image-ref: registry.digitalocean.com/adbsoftwaresolutions/app-admin-website:${{ steps.meta.outputs.tag_suffix }}
                  severity: HIGH,CRITICAL
                  output: trivy-image-scan.txt
              env:
                  TRIVY_USERNAME: ${{ secrets.DO_REGISTRY_USERNAME }}
                  TRIVY_PASSWORD: ${{ secrets.DO_REGISTRY_ACCESS_TOKEN }}
            - uses: actions/upload-artifact@v4
              with:
                  name: trivy-docker-image-scan-admin-website
                  path: trivy-image-scan.txt
