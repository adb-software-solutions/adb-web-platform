services:
    app:
        build:
            context: ..
            dockerfile: .devcontainer/Dockerfile
        command: sleep infinity
        env_file:
            - .env
        depends_on:
            - db
            - redis-cache
            - redis-session
        networks:
            - adbsoftwaresolutions-dev

    db:
        image: postgres:14.4
        restart: unless-stopped
        volumes:
            - postgres-data:/var/lib/postgresql/data
        environment:
            POSTGRES_DB: adbsoftwaresolutions_dev
            POSTGRES_USER: adbsoftwaresolutions
            POSTGRES_PASSWORD: adbsoftwaresolutions_dev_password
        ports:
            - "5432:5432"
        networks:
            - adbsoftwaresolutions-dev

    redis-cache:
        image: redis:7.0.4
        restart: unless-stopped
        networks:
            - adbsoftwaresolutions-dev

    redis-session:
        image: redis:7.0.4
        restart: unless-stopped
        networks:
            - adbsoftwaresolutions-dev

    clamav:
        image: clamav/clamav-debian:1.5
        profiles:
            - malware-scanning
        restart: unless-stopped
        volumes:
            - clamav-data:/var/lib/clamav
        networks:
            - adbsoftwaresolutions-dev

volumes:
    postgres-data:
    clamav-data:

networks:
    adbsoftwaresolutions-dev:
        driver: bridge
